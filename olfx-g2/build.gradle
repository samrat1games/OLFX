// OLFX launcher for Pico G2 (Pico Native SDK 2.8.5.4, VRActivity). The AAR lives in libs/ (Pico's SDK, not ours).
plugins {
    id 'com.android.application'
}

android {
    namespace 'org.olfx.g2'
    compileSdk project.sharedCompileSdk
    ndkVersion "${ndk_version}"

    defaultConfig {
        applicationId 'org.olfx.launcher.g2'
        minSdkVersion 24
        targetSdkVersion 26
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments "-DOLFX_G2_BUILD=ON", "-DANDROID_STL=c++_static" }
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version "${cmake_version}"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ["${rootDir}/src/xrt/targets/openxr_android/src/main/assets"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

dependencies {
    implementation files('libs/PvrSDK-Native-release.aar')
}
