name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :src:xrt:targets:openxr_android:testOutOfProcessDebugUnitTest --no-daemon
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - run: ./gradlew :src:xrt:targets:openxr_android:assembleOutOfProcessDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - uses: actions/upload-artifact@v4
        with:
          name: OLFX-android-debug
          path: src/xrt/targets/openxr_android/build/outputs/apk/outOfProcess/debug/*.apk
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sh tools/go/fetch_vrapi.sh build/vrapi
      - run: ./gradlew :olfx-go:assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - uses: actions/upload-artifact@v4
        with:
          name: OLFX-go-debug
          path: olfx-go/build/outputs/apk/debug/*.apk
  g2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :olfx-g2:assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - uses: actions/upload-artifact@v4
        with:
          name: OLFX-g2-debug
          path: olfx-g2/build/outputs/apk/debug/*.apk
  monkego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
      - uses: gradle/actions/setup-gradle@v4
      - run: javac -d /tmp/mk monkego-apk/src/main/java/org/olfx/monkego/AssetServer.java monkego-apk/test/AssetServerTest.java && java -cp /tmp/mk org.olfx.monkego.AssetServerTest monkego/web
      - run: ./gradlew :monkego-apk:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MonkeGo-apk
          path: monkego-apk/build/outputs/apk/debug/*.apk
