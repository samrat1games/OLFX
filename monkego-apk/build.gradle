// Monke Go launcher APK: bundles the web game, serves it on http://localhost:8765 and opens it in the headset's browser
// (WebXR works in a real browser; a WebView has no WebXR).
plugins {
    id 'com.android.application'
}

android {
    namespace 'org.olfx.monkego'
    compileSdk project.sharedCompileSdk

    defaultConfig {
        applicationId 'org.olfx.monkego'
        minSdkVersion 24
        targetSdkVersion 28
        versionCode 1
        versionName '1.0'
    }
    sourceSets {
        // assets/web/** is a copy of monkego/web without the *.gz twins (AGP rejects park.bin + park.bin.gz as duplicates;
        // the game falls back to the uncompressed map when the .gz is missing)
        main { assets.srcDirs = ["${buildDir}/webassets"] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

tasks.register('prepareWeb', Copy) {
    from("${rootDir}/monkego/web") { exclude '**/*.gz' }
    into "${buildDir}/webassets/web"
}
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('Assets')) t.dependsOn 'prepareWeb'
}
